services:
  backend:
    build:
      context: ./backend
    image: omnicare-backend:latest
    env_file:
      - path: .env
        required: false # the stack boots without a .env (chat then answers 503 until a key is set)
    environment:
      # Inside the container, localhost is the container itself: reach host Ollama via host-gateway.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CLAIMS_FILE_PATH: /app/storage/claims/mock_claims.json
      CHROMA_PATH: /app/storage/chroma
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8501,http://127.0.0.1:8501}
      # Hosts reached directly even when the Docker host injects HTTP(S)_PROXY into containers.
      NO_PROXY: localhost,127.0.0.1,host.docker.internal
      no_proxy: localhost,127.0.0.1,host.docker.internal
    ports:
      - "8000:8000"
    volumes:
      - claims_data:/app/storage/claims
      - chroma_data:/app/storage/chroma
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u,sys; sys.exit(0 if u.build_opener(u.ProxyHandler({})).open('http://127.0.0.1:8000/api/v1/health', timeout=3).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: omnicare-frontend:latest
    environment:
      BACKEND_URL: http://backend:8000
      NO_PROXY: localhost,127.0.0.1,backend
      no_proxy: localhost,127.0.0.1,backend
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u,sys; sys.exit(0 if u.build_opener(u.ProxyHandler({})).open('http://127.0.0.1:8501/_stcore/health', timeout=3).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  claims_data: # working copy of mock_claims.json (seeded from the image on first start)
  chroma_data: # persisted Chroma vector store
